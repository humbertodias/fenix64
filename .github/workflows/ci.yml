name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux
            dist_static: dist/linux-static
            dist_shared: dist/linux-shared
          - platform: windows
            artifact: windows-mingw
            dist_static: dist/windows-static
            dist_shared: dist/windows-shared

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          platforms: linux/amd64
          tags: fenix-${{ matrix.platform }}
          load: true
          provenance: false
          cache-from: type=gha,scope=fenix-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=fenix-${{ matrix.platform }}

      - name: Build static
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh ${{ matrix.platform }} static

      - name: Build shared
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/docker-build.sh ${{ matrix.platform }} shared

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: fenix-${{ matrix.artifact }}-static
          path: ${{ matrix.dist_static }}/
          if-no-files-found: error

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: fenix-${{ matrix.artifact }}-shared
          path: ${{ matrix.dist_shared }}/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build static
        run: bash scripts/macos-build.sh static

      - name: Build shared
        run: bash scripts/macos-build.sh shared

      - name: Upload static
        uses: actions/upload-artifact@v7
        with:
          name: fenix-macos-static
          path: dist/macos-static/
          if-no-files-found: error

      - name: Upload shared
        uses: actions/upload-artifact@v7
        with:
          name: fenix-macos-shared
          path: dist/macos-shared/
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fenix-*
          path: artifacts

      - name: Pack platform archives
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release
          tag="${GITHUB_REF_NAME}"
          for dir in artifacts/fenix-*; do
            name="$(basename "$dir")"
            flat="$(mktemp -d)"
            find "$dir" -type f -exec cp {} "$flat/" \;
            (cd "$flat" && zip -r "$GITHUB_WORKSPACE/release/${name}-${tag}.zip" .)
          done
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
          body: |
            Builds of `fxc`, `fxi`, `map`, and `fpg` for Linux, Windows, and macOS.

            Archives are named `fenix-<os>[-mingw]-<static|shared>-<tag>.zip`, with the executables at the zip root:
            - **static** — libraries linked into the binaries where possible (`-static-libgcc` plus static SDL 1.2 / SDL_mixer on Linux, `-static` on Windows, `-search_paths_first` on macOS)
            - **shared** — dynamic SDL/png; Windows includes MinGW DLLs, macOS includes SDL_mixer dylibs
            - **fenix-linux-*** — x86_64 ELF from `docker/Dockerfile.linux` (Ubuntu 22.04, SDL 1.2)
            - **fenix-windows-mingw-*** — x86_64 PE from `docker/Dockerfile.windows` (MinGW-w64, SDL 1.2 / png / zlib / gif / ogg / vorbis)
            - **fenix-macos-*** — native Homebrew `sdl12-compat` plus SDL_mixer 1.2 built from source

            Linux and Windows CI images come from `docker/Dockerfile.linux` and `docker/Dockerfile.windows`.
            Linux static binaries still need OS X11 / ALSA / Pulse libraries at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
