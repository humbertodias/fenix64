name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl1.2-dev \
            libsdl-mixer1.2-dev \
            libpng-dev \
            zlib1g-dev \
            libgif-dev \
            pkg-config

      - name: Configure
        run: ./configure --enable-fpg --enable-map

      - name: Build
        run: make -j"$(nproc)"

      - name: Check binaries
        run: |
          test -x fxc/src/fxc
          test -x fxi/src/fxi
          test -x map/map
          test -x fpg/fpg
          ./fxc/src/fxc -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-linux
          path: |
            fxc/src/fxc
            fxi/src/fxi
            map/map
            fpg/fpg

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install sdl12-compat libpng giflib pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build SDL_mixer 1.2
        run: |
          mkdir -p deps
          cd deps
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ./configure --prefix="$PWD/../local" \
              CPPFLAGS="$(pkg-config --cflags sdl)" \
              LDFLAGS="$(pkg-config --libs-only-L sdl)" \
              LIBS="$(pkg-config --libs-only-l sdl)"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: ./configure --enable-fpg --enable-map

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Check binaries
        run: |
          test -x fxc/src/fxc
          test -x fxi/src/fxi
          test -x map/map
          test -x fpg/fpg
          ./fxc/src/fxc -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-macos
          path: |
            fxc/src/fxc
            fxi/src/fxi
            map/map
            fpg/fpg

  windows-mingw:
    name: Windows (MinGW)
    runs-on: ubuntu-latest
    env:
      HOST: x86_64-w64-mingw32
      MINGW_PREFIX: ${{ github.workspace }}/.mingw
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            mingw-w64-tools \
            make \
            pkg-config

      - name: Build MinGW dependencies
        run: |
          set -euo pipefail
          mkdir -p "$MINGW_PREFIX"/{bin,include,lib/pkgconfig}
          export PATH="$MINGW_PREFIX/bin:$PATH"
          export CC="${HOST}-gcc"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export WINDRES="${HOST}-windres"
          export PKG_CONFIG_LIBDIR="$MINGW_PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$MINGW_PREFIX/include"
          export LDFLAGS="-L$MINGW_PREFIX/lib"
          DEPS="$GITHUB_WORKSPACE/.mingw-src"
          mkdir -p "$DEPS"
          cd "$DEPS"

          fetch() {
            echo "Downloading $1"
            curl -fL --retry 5 --retry-all-errors -o "$2" "$1"
          }

          if [ ! -f "$MINGW_PREFIX/lib/libz.a" ]; then
            fetch https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz zlib.tar.gz \
              || fetch https://zlib.net/fossils/zlib-1.3.1.tar.gz zlib.tar.gz
            tar xzf zlib.tar.gz
            make -C zlib-1.3.1 -f win32/Makefile.gcc PREFIX="${HOST}-" \
              BINARY_PATH="$MINGW_PREFIX/bin" \
              INCLUDE_PATH="$MINGW_PREFIX/include" \
              LIBRARY_PATH="$MINGW_PREFIX/lib" \
              SHARED_MODE=0 install
          fi

          if [ ! -f "$MINGW_PREFIX/lib/libpng.a" ]; then
            fetch https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.43.tar.gz libpng.tar.gz
            tar xzf libpng.tar.gz
            cd libpng-1.6.43
            ./configure --host="$HOST" --prefix="$MINGW_PREFIX" \
              --disable-shared --enable-static
            make -j"$(nproc)"
            make install
            cd ..
          fi

          if [ ! -f "$MINGW_PREFIX/lib/libgif.a" ]; then
            fetch https://sourceforge.net/projects/giflib/files/giflib-5.2.2.tar.gz/download giflib.tar.gz
            tar xzf giflib.tar.gz
            make -C giflib-5.2.2 libgif.a CC="${HOST}-gcc" AR="${HOST}-ar"
            cp giflib-5.2.2/libgif.a "$MINGW_PREFIX/lib/"
            cp giflib-5.2.2/gif_lib.h "$MINGW_PREFIX/include/"
          fi

          if [ ! -x "$MINGW_PREFIX/bin/sdl-config" ]; then
            fetch https://www.libsdl.org/release/SDL-1.2.15.tar.gz sdl.tar.gz \
              || fetch https://github.com/libsdl-org/SDL-1.2/releases/download/release-1.2.15/SDL-1.2.15.tar.gz sdl.tar.gz
            tar xzf sdl.tar.gz
            cd SDL-1.2.15
            if [ ! -f configure ]; then
              sudo apt-get install -y autoconf automake libtool
              ./autogen.sh
            fi
            ./configure --host="$HOST" --prefix="$MINGW_PREFIX" \
              --disable-shared --enable-static \
              --disable-video-x11 --disable-video-opengl --disable-nasm
            make -j"$(nproc)"
            make install
            cd ..
          fi

          if [ ! -f "$MINGW_PREFIX/lib/libSDL_mixer.a" ]; then
            fetch https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz sdl_mixer.tar.gz
            tar xzf sdl_mixer.tar.gz
            cd SDL_mixer-1.2.12
            ./configure --host="$HOST" --prefix="$MINGW_PREFIX" \
              --disable-shared --enable-static --disable-sdltest \
              --disable-music-mp3 --disable-music-mod \
              --disable-music-ogg --disable-music-flac \
              SDL_CONFIG="$MINGW_PREFIX/bin/sdl-config"
            make -j"$(nproc)"
            make install
            cd ..
          fi
          test -f "$MINGW_PREFIX/lib/libSDL.a"
          test -f "$MINGW_PREFIX/lib/libSDL_mixer.a"

      - name: Configure
        run: |
          export PATH="$MINGW_PREFIX/bin:$PATH"
          export MINGW_PREFIX
          export PKG_CONFIG_LIBDIR="$MINGW_PREFIX/lib/pkgconfig"
          export CPPFLAGS="-I$MINGW_PREFIX/include"
          export LDFLAGS="-L$MINGW_PREFIX/lib"
          export SDL_CONFIG="$MINGW_PREFIX/bin/sdl-config"
          ./configure --host="$HOST" --enable-fpg --enable-map --disable-sdltest \
            || { echo '===== config.log (tail) ====='; tail -n 80 config.log; exit 1; }

      - name: Build
        run: make -j"$(nproc)"

      - name: Check binaries
        run: |
          test -f fxc/src/fxc.exe
          test -f fxi/src/fxi.exe
          test -f map/map.exe
          test -f fpg/fpg.exe
          file fxc/src/fxc.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-windows-mingw
          path: |
            fxc/src/fxc.exe
            fxi/src/fxi.exe
            map/map.exe
            fpg/fpg.exe

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows-mingw]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack platform archives
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release
          tag="${GITHUB_REF_NAME}"
          for dir in artifacts/fenix-*; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/${name}-${tag}.zip" .)
          done
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
