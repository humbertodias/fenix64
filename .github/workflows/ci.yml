name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl1.2-dev \
            libsdl-mixer1.2-dev \
            libpng-dev \
            zlib1g-dev \
            libgif-dev \
            pkg-config

      - name: Configure
        run: ./configure --enable-fpg --enable-map

      - name: Build
        run: make -j"$(nproc)"

      - name: Check binaries
        run: |
          test -x fxc/src/fxc
          test -x fxi/src/fxi
          test -x map/map
          test -x fpg/fpg
          ./fxc/src/fxc -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-linux
          path: |
            fxc/src/fxc
            fxi/src/fxi
            map/map
            fpg/fpg

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install sdl12-compat libpng giflib pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build SDL_mixer 1.2
        run: |
          mkdir -p deps
          cd deps
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ./configure --prefix="$PWD/../local" \
              CPPFLAGS="$(pkg-config --cflags sdl)" \
              LDFLAGS="$(pkg-config --libs-only-L sdl)" \
              LIBS="$(pkg-config --libs-only-l sdl)"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: ./configure --enable-fpg --enable-map

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Check binaries
        run: |
          test -x fxc/src/fxc
          test -x fxi/src/fxi
          test -x map/map
          test -x fpg/fpg
          ./fxc/src/fxc -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-macos
          path: |
            fxc/src/fxc
            fxi/src/fxi
            map/map
            fpg/fpg

  windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-cc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-giflib
            mingw-w64-x86_64-sdl12-compat
            mingw-w64-x86_64-SDL_mixer

      - name: Configure
        run: |
          if ! pkg-config --exists sdl && pkg-config --exists sdl12_compat; then
            mkdir -p .ci-pkgconfig
            cp "$(pkg-config --variable=pcfiledir sdl12_compat)/sdl12_compat.pc" .ci-pkgconfig/sdl.pc
            export PKG_CONFIG_PATH="$PWD/.ci-pkgconfig:${PKG_CONFIG_PATH}"
          fi
          ./configure --enable-fpg --enable-map --disable-sdltest

      - name: Build
        run: make -j"$(nproc)"

      - name: Check binaries
        run: |
          test -x fxc/src/fxc.exe
          test -x fxi/src/fxi.exe
          test -x map/map.exe
          test -x fpg/fpg.exe
          ./fxc/src/fxc.exe -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: fenix-windows-mingw
          path: |
            fxc/src/fxc.exe
            fxi/src/fxi.exe
            map/map.exe
            fpg/fpg.exe
